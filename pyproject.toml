[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "stratval"
version = "0.1.0"
description = "A leakage-free validation harness for systematic trading-strategy research"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Niles Liu" }]
keywords = [
    "quantitative-finance", "validation", "backtest-overfitting", "bootstrap",
    "walk-forward", "deflated-sharpe-ratio", "hypothesis-testing", "time-series",
    "statistics",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.2",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
